name: Build offline installers and draft a release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to package
        required: true
        type: string
env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  installers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundle: dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rust-targets: x86_64-pc-windows-msvc
            bundle: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Check release version
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json'));
          const tauri = JSON.parse(readFileSync('src-tauri/tauri.conf.json'));
          const cargo = readFileSync('src-tauri/Cargo.toml', 'utf8').match(/^version = "([^"]+)"/m)?.[1];
          if (process.env.RELEASE_TAG !== `v${pkg.version}` || tauri.version !== pkg.version || cargo !== pkg.version) {
            throw new Error('Tag and package.json, tauri.conf.json, Cargo.toml versions must agree.');
          }
          JS
      - run: npm test
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked -- -D warnings
      - name: Build standalone offline installer
        run: npm run tauri build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}
      - run: npm run verify:offline
      - name: Install test browser
        if: runner.os == 'Windows'
        run: npx playwright install --no-shell chromium
      - name: Verify Windows system rules
        if: runner.os == 'Windows'
        run: node scripts/verify-windows-blocking.mjs src-tauri/target/${{ matrix.target }}/release/arceo.exe
      - name: Verify real Chrome protection
        if: runner.os == 'Windows'
        run: node scripts/verify-browser-protection.mjs src-tauri/target/${{ matrix.target }}/release/arceo.exe
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.target }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
  release:
    needs: installers
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          merge-multiple: true
          path: release-assets
      - name: Flatten installer paths
        run: |
          find release-assets -mindepth 2 -type f \( -name '*.dmg' -o -name '*.exe' \) -exec mv {} release-assets/ \;
      - run: node scripts/release-checksums.mjs release-assets
      - name: Create draft download release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" \
            --verify-tag --draft --title "Arceo $RELEASE_TAG" \
            --notes-file docs/release-notes.md \
            release-assets/*.dmg release-assets/*.exe release-assets/SHA256SUMS.txt
