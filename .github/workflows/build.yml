name: Check and package desktop apps
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm test
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked -- -D warnings
      - name: Package macOS
        if: runner.os == 'macOS'
        run: npm run tauri build -- --bundles app,dmg
      - name: Verify native engine without network access
        if: runner.os == 'macOS'
        run: npm run verify:engine-offline
      - name: Package Windows
        if: runner.os == 'Windows'
        run: npm run tauri build -- --bundles nsis
      - name: Verify bundled offline assets
        run: npm run verify:offline
      - uses: actions/upload-artifact@v4
        with:
          name: arceo-${{ runner.os }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
