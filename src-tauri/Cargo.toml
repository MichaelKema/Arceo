[package]
name = "arceo"
version = "0.1.1"
description = "Your space to focus. Website and app blocker for macOS and Windows."
authors = ["Arceo"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "arceo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.37"
fs2 = "0.4"
url = "2"
plist = "1"
tempfile = "3"
ctrlc = { version = "3.4", features = ["termination"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }
